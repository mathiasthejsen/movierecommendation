# Weekly data pipeline + static site deploy to GitHub Pages.
#
# Triggers:
#   * push to main          -> test, build and deploy the site (reuses the last published data).
#                              If no real data has been published yet, the pipeline runs first.
#   * weekly schedule       -> run the data pipeline, publish data to the `data` branch, then build + deploy
#   * manual (Run workflow) -> same as schedule; untick "run_pipeline" to only rebuild the site
#
# Repository secrets (Settings -> Secrets and variables -> Actions -> Secrets):
#   TMDB_API_KEY (or TMDB_READ_TOKEN), REDDIT_CLIENT_ID, REDDIT_CLIENT_SECRET,
#   optional: REDDIT_USERNAME, REDDIT_PASSWORD, TRAKT_CLIENT_ID, IG_USER_ID, IG_ACCESS_TOKEN
# Repository variables (… -> Variables):
#   SUPABASE_URL, SUPABASE_ANON_KEY (public by design), optional WATCH_REGION, REDDIT_USER_AGENT
#
# Secrets are only exposed to the pipeline step. The site build only sees the public variables.

name: Pipeline & Pages

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC
  workflow_dispatch:
    inputs:
      run_pipeline:
        description: "Run the data pipeline before building"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Decide whether this run refreshes the data. Manual runs only skip it when the box is
  # explicitly unticked; pushes run it once, until the first real data has been published.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_pipeline: ${{ steps.decide.outputs.run_pipeline }}
    steps:
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          INPUT: ${{ github.event.inputs.run_pipeline }}
          REPO: ${{ github.repository }}
          TOKEN: ${{ github.token }}
        run: |
          run=false
          if [ "$EVENT" = "schedule" ]; then
            run=true
          elif [ "$EVENT" = "workflow_dispatch" ] && [ "$INPUT" != "false" ]; then
            run=true
          elif [ "$EVENT" = "push" ] && ! git ls-remote --exit-code --heads "https://x-access-token:${TOKEN}@github.com/${REPO}.git" data >/dev/null 2>&1; then
            echo "::notice::No published data yet (no 'data' branch); running the pipeline on this push."
            run=true
          fi
          echo "run_pipeline=$run" >> "$GITHUB_OUTPUT"
          echo "event=$EVENT input=${INPUT:-<none>} -> run_pipeline=$run"

  pipeline:
    needs: plan
    if: needs.plan.outputs.run_pipeline == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write # force-push the generated artifact to the `data` branch
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r pipeline/requirements.txt

      - name: Restore previous artifact (curator pick history)
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch --depth=1 origin data
            rm -rf public/data && mkdir -p public/data
            git archive FETCH_HEAD | tar -x -C public/data
          fi

      - name: Check TMDB key
        id: keys
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
        run: |
          if [ -z "$TMDB_API_KEY" ] && [ -z "$TMDB_READ_TOKEN" ]; then
            echo "::warning::TMDB_API_KEY secret is not set; skipping the pipeline. The site keeps its current data."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache MovieLens download and API caches
        if: steps.keys.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: |
            data/raw
            data/cache
          key: pipeline-${{ runner.os }}-${{ github.run_id }}
          restore-keys: pipeline-${{ runner.os }}-

      - name: Download MovieLens ml-32m
        if: steps.keys.outputs.skip != 'true'
        run: python -m pipeline.download

      - name: Build artifact
        if: steps.keys.outputs.skip != 'true'
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USERNAME: ${{ secrets.REDDIT_USERNAME }}
          REDDIT_PASSWORD: ${{ secrets.REDDIT_PASSWORD }}
          REDDIT_USER_AGENT: ${{ vars.REDDIT_USER_AGENT }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          WATCH_REGION: ${{ vars.WATCH_REGION || 'US' }}
        run: python -m pipeline.build

      - name: Publish artifact to the `data` branch
        if: steps.keys.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd public/data
          rm -rf .git
          git init -q -b data
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "data: $(date -u +%F) (run ${{ github.run_id }})"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" data
          du -sh .

  build:
    needs: [plan, pipeline]
    if: always() && needs.plan.result == 'success' && needs.pipeline.result != 'failure' && needs.pipeline.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Use latest published data (falls back to the bundled sample)
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch --depth=1 origin data
            rm -rf public/data && mkdir -p public/data
            git archive FETCH_HEAD | tar -x -C public/data
            echo "Using data branch: $(jq -r .generatedAt public/data/meta.json)"
          else
            echo "::notice::No data branch yet; deploying the bundled sample artifact."
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - run: npm ci
      - run: pip install -r pipeline/requirements.txt

      - name: Tests
        run: |
          npm test
          python -m pytest -q

      - name: Configure Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Build static site
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          npm run build
          touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: out

  deploy:
    needs: build
    if: always() && needs.build.result == 'success' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
